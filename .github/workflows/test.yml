name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Verified FWA sources match provenance
        run: python3 script/fwa_refs.py
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv

  fork:
    runs-on: ubuntu-latest
    env:
      # Archive node: every fork suite pins a block, which a pruned node stops serving within minutes.
      MAINNET_RPC_URL: https://eth.drpc.org
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ hashFiles('test/fork/**') }}
          restore-keys: foundry-rpc-
      - name: Fork tests
        run: forge test --match-path "test/fork/*" -vvv

  keeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
