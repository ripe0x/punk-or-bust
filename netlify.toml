# Netlify builds the static web app in web/. Keeping this file at the repo root means the linked
# repo builds correctly without any base-directory setting in the Netlify UI.
# Build env (Netlify UI, not this file): VITE_RPC_URL, VITE_FACTORY, VITE_FROM_BLOCK,
# optional VITE_CHAIN_ID (default 1), VITE_DEFAULT_KEEPER and VITE_WALLETCONNECT_PROJECT_ID.
# VITE_RPC_URL ships in the public bundle: use a public or domain-restricted endpoint.
# Routes are hash routes, so no SPA redirect.

[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
