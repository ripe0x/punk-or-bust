# Netlify builds the static web app in web/. Keeping this file at the repo root means the linked
# repo builds correctly without any base-directory setting in the Netlify UI.
# Build env (Netlify UI, not this file): VITE_RPC_URL, VITE_FACTORY, VITE_FROM_BLOCK,
# optional VITE_CHAIN_ID (default 1), VITE_DEFAULT_KEEPER and VITE_IMAGE_API.
# VITE_WALLETCONNECT_PROJECT_ID is a public WalletConnect Cloud id (it ships in the client bundle),
# so it is set below; restrict it to the app's domain in WalletConnect Cloud.
# VITE_RPC_URL ships in the public bundle: use a public or domain-restricted endpoint. It must
# serve eth_getLogs from VITE_FROM_BLOCK (archive); pruned public nodes drop older history.

[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_WALLETCONNECT_PROJECT_ID = "35fbd0525a32173af1040dc520a0e505"

# Path-based routes (/run, /faq, /vault/0x...): serve the app for any path so deep links and
# refreshes work. Real files under /assets are served before this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
